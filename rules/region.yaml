# 의정부 한정 지역 규칙. 위에서부터 차례로 적용하고 처음 맞는 규칙으로 구분을 정합니다.
uijeongbu:
  code: "41150"          # 법정 시군구코드
  names: ["의정부"]

gyeonggi:
  names: ["경기도", "경기"]
  # 경기도 사업 중 본문 대상 지역이 이 말을 포함하면 '경기도 전역'으로 봄
  whole_province_words: ["경기도 전역", "경기도 거주", "도내 거주", "경기도민"]

# 중앙부처 사업 중 이 말이 대상 지역에 있으면 의정부는 해당 없음 → 제외
exclude_words: ["비수도권", "인구감소지역", "지방 소재"]

# 경기도 31개 시·군 (의정부 제외). 대상 지역에 이것만 있고 의정부가 없으면 제외
gyeonggi_cities: [수원, 성남, 고양, 용인, 부천, 안산, 안양, 남양주, 화성, 평택, 시흥, 파주, 김포, 광명, 광주, 군포, 하남, 오산, 이천, 안성, 의왕, 양평, 여주, 동두천, 과천, 구리, 포천, 양주, 가평, 연천]

# 광역시·도 이름. 소관기관이 이 중 경기도가 아닌 곳이면 제외
other_provinces: [서울, 부산, 대구, 인천, 광주광역시, 대전, 울산, 세종, 강원, 충청북도, 충북, 충청남도, 충남, 전북, 전라북도, 전남, 전라남도, 경상북도, 경북, 경상남도, 경남, 제주]
